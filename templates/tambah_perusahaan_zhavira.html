<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Tambah Perusahaan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="dashboard-layout">

    <div class="sidebar">
        <div>
            <div class="sidebar-profile">
                <h2>{{ session.nama_perusahaan_zhavira }}</h2>
                <p>{{ session.nama_market_zhavira }}</p>
                <p>{{ session.role_zhavira }}</p>
                <p>{{ session.nama_user_zhavira }}</p>
            </div>
            <div class="sidebar-menu">
                <a href="{{ url_for('dashboard_admin') }}">Dashboard</a>
                <a href="{{ url_for('data_user') }}">Data User</a>
                <a href="{{ url_for('data_perusahaan') }}">Data Perusahaan</a>
                <a href="{{ url_for('laporan_keuangan') }}">Laporan</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="container fade-in">
            <h1>Tambah Perusahaan</h1>

            <form method="post" action="{{ url_for('tambahperusahaan') }}">
                <label>Alamat</label>
                <input type="text" name="alamat_zhavira" required>

                <label>No Telpon</label>
                <input type="number" name="no_telp_zhavira" required>

                <div style="margin-top:15px;">
                    <button type="submit">Simpan</button>
                    <a href="{{ url_for('data_perusahaan') }}" style="text-decoration: none;">
                        <button type="button">Batal</button>
                    </a>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
