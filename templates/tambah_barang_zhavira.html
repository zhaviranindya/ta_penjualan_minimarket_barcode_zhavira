<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Tambah Barang</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="dashboard-layout">

    <div class="sidebar">
        <div>
            <div class="sidebar-profile">
                <h2>{{ session.nama_perusahaan_zhavira }}</h2>
                <p>{{ session.nama_market_zhavira }}</p>
                <p>{{ session.role_zhavira }}</p>
                <p>{{ session.nama_user_zhavira }}</p>
            </div>
            <div class="sidebar-menu">
                <a href="{{ url_for('dashboard_staf') }}">Dashboard</a> 
                <a href="{{ url_for('data_barang') }}">Data Barang</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="container fade-in">
            <h1>Tambah Barang</h1>

            <form method="post" action="{{ url_for('tambahbarang') }}">
                <div class="form-row" style="display:flex; gap:20px; flex-wrap:wrap;">
                    <div class="col" style="flex:1;">
                        <label>Kode Barang</label>
                        <input type="text" name="kode_barang_zhavira" required>
                    </div>
                    <div class="col" style="flex:1;">
                        <label>Nama Barang</label>
                        <input type="text" name="nama_barang_zhavira" required>
                    </div>
                </div>

                <label>Harga</label>
                <input type="number" name="harga_zhavira" min="0" required>

                <label>Stok</label>
                <input type="number" name="stok_zhavira" min="0" required>

                <div style="margin-top:15px;">
                    <button type="submit">Simpan</button>
                    <a href="{{ url_for('data_barang') }}">
                        <button type="button">Batal</button>
                    </a>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
