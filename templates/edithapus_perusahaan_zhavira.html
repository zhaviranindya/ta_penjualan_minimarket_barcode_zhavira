<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Edit Perusahaan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dashboard-layout">

    <div class="sidebar">
        <div>
            <div class="sidebar-profile">
                <h2>{{ session.nama_perusahaan_zhavira }}</h2>
                <p>{{ session.nama_market_zhavira }}</p>
                <p>{{ session.role_zhavira }}</p>
                <p>{{ session.nama_user_zhavira }}</p>
            </div>
            <div class="sidebar-menu">
                <a href="{{ url_for('dashboard_admin') }}">Dashboard</a>
                <a href="{{ url_for('data_user') }}">Data User</a>
                <a href="{{ url_for('data_perusahaan') }}">Data Perusahaan</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="container fade-in">
            <h1>Edit Perusahaan</h1>

            <form method="post" action="{{ url_for('edit_perusahaan', id_perusahaan_zhavira=perusahaan1.id_perusahaan_zhavira) }}">
                <div style="display:flex; gap:20px; flex-wrap:wrap; margin-top:15px;">
                    <div style="flex:1;">
                        <label>ID Perusahaan</label>
                        <input type="text" name="id_perusahaan_zhavira" value="{{ perusahaan1.id_perusahaan_zhavira }}" required>
                    </div>
                </div>

                <div style="display:flex; gap:20px; flex-wrap:wrap;">
                    <div style="flex:1;">
                        <label>Nama Perusahaan</label>
                        <input type="text" name="nama_perusahaan_zhavira" value="{{ perusahaan1.nama_perusahaan_zhavira }}" required>
                    </div>
                    <div style="flex:1;">
                        <label>Nama Market</label>
                        <input type="text" name="nama_market_zhavira" value="{{ perusahaan1.nama_market_zhavira }}" required>
                    </div>
                    <div style="flex:1;">
                        <label>Alamat</label>
                        <input type="text" name="alamat_zhavira" value="{{ perusahaan1.alamat_zhavira }}" required>
                    </div>
                    <div style="flex:1;">
                        <label>No Telpon</label>
                        <input type="number" name="no_telp_zhavira" value="{{ perusahaan1.no_telp_zhavira }}" required>
                    </div>
                </div>

                <div style="margin-top:20px;">
                    <button type="submit">Update Perusahaan</button>
                    <a href="{{ url_for('data_perusahaan') }}">
                        <button type="button">Batal</button>
                    </a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
